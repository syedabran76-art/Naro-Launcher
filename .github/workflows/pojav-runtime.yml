name: Naro - Pojav Runtime Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-runtime:
    name: Inspect Pojav and Build Naro
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Naro Launcher
        uses: actions/checkout@v4
        with:
          path: naro

      - name: Checkout Pojav source
        uses: actions/checkout@v4
        with:
          repository: TeamPojavLauncher/PojavLauncher
          ref: v3_openjdk
          submodules: recursive
          path: pojav

      - name: Inspect repository layouts
        run: |
          echo "=== Naro root ==="
          ls -la naro
          echo "=== Naro Gradle files ==="
          find naro -maxdepth 4 \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -type f -print
          echo "=== Pojav root ==="
          ls -la pojav
          echo "=== Pojav Gradle modules ==="
          grep -nE 'include.*app_pojavlauncher|include.*jre_lwjgl3glfw' \
            pojav/settings.gradle 2>/dev/null || true
          echo "=== Pojav wrapper ==="
          test -f pojav/gradlew && echo "Pojav Gradle wrapper found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build Naro APK
        working-directory: naro
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Naro APK
        uses: actions/upload-artifact@v4
        with:
          name: naro-debug-apk
          path: naro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
